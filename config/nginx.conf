server {
    # Handle ACME challenge and redirect everything else to HTTPS
    listen 80;
    listen [::]:80;

    server_name connect.womenemerging.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            allow all;
    }

    location / {
         return 301 https://$host$uri$is_args$args;
    }
}


server {
    listen                  443 ssl;
    listen                  [::]:443 ssl;
    server_name connect.womenemerging.org;


    ssl_certificate /home/ubuntu/.acme.sh/connect.womenemerging.org_ecc/fullchain.cer;
    ssl_certificate_key /home/ubuntu/.acme.sh/connect.womenemerging.org_ecc/connect.womenemerging.org.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

        client_max_body_size 64M;
 # Increase timeouts (fix 504 Gateway Time-out)
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    error_page   500 502 503 504  /50x.html;
}